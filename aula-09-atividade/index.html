<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Calculadora</title>
</head>

<body>
    <div class="container">
        <h1>Calculadora</h1>

        <p class="subtitulo">♡ faça suas continhas com carinho ♡</p>

        <div class="input-grid">
            <input
                type="number"
                name="n1"
                id="n1"
                placeholder="Primeiro número... ♡"
            >

            <input
                type="number"
                name="n2"
                id="n2"
                placeholder="Segundo número... ♡"
            >
        </div>

        <div class="botoes">
            <input
                type="button"
                value="＋"
                name="soma"
                id="soma"
                onclick="somar()"
                class="botao"
            >

            <input
                type="button"
                value="−"
                name="subtracao"
                id="subtracao"
                onclick="subtrair()"
                class="botao"
            >

            <input
                type="button"
                value="×"
                name="multiplicacao"
                id="multiplicacao"
                onclick="multiplicar()"
                class="botao"
            >

            <input
                type="button"
                value="÷"
                name="divisao"
                id="divisao"
                onclick="dividir()"
                class="botao"
            >

            <input
                type="button"
                value="♡ LIMPAR ♡"
                name="limpar"
                id="limpar"
                onclick="limpar()"
                class="botao limpar"
            >
        </div>

        <div id="resultado">୨୧ O resultado aparecerá aqui ୨୧</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
