<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semáforo com JavaScript</title>
    <!-- IMPORTANDO O CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Semáforo com JavaScript</h1>
    
    <div class="container">
        <div class="luz" id="parar"></div>
        <div class="luz" id="atencao"></div>
        <div class="luz" id="siga"></div>
        <br>
 
    <!-- BOTÕES -->
    <div>
        <button onclick="parar()" id="btnPare">Pare!</button>
        <button onclick="atencao()" id="btnAtencao">Atenção!</button>
        <button onclick="siga()" id="btnSiga">Siga!</button>
    </div>
    </div>
    <!-- IMPORTANDO O JAVASCRIPT -->
    <script src="script.js"></script>
</body>
</html>
